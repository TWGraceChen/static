<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>第44屆亞太兒少跨代領袖特會｜報名相關聲明草稿</title>

  <style>
    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --text: #1f2937;
      --muted: #64748b;
      --line: #e5e7eb;
      --primary: #3157a4;
      --primary-soft: #eef3ff;
      --accent: #d89a3d;
      --shadow: 0 14px 36px rgba(30, 41, 59, 0.08);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;
      background:
        radial-gradient(circle at top left, #eef3ff 0, transparent 35%),
        radial-gradient(circle at top right, #fff6e8 0, transparent 30%),
        var(--bg);
      color: var(--text);
      line-height: 1.75;
    }

    button {
      font: inherit;
    }

    .page-shell {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 40px 0 72px;
    }

    .hero {
      text-align: center;
      margin-bottom: 36px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(49, 87, 164, 0.08);
      color: var(--primary);
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(30px, 4vw, 46px);
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .hero p {
      max-width: 760px;
      margin: 14px auto 0;
      color: var(--muted);
      font-size: 16px;
    }

    .notice {
      margin: 0 auto 28px;
      max-width: 900px;
      padding: 16px 18px;
      border: 1px solid #f0d7a8;
      border-radius: 14px;
      background: #fffaf0;
      color: #77521b;
      font-size: 14px;
    }

    .roles {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }

    .role-card {
      appearance: none;
      border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.92);
      border-radius: var(--radius);
      padding: 28px 24px;
      text-align: left;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .role-card:hover {
      transform: translateY(-4px);
      border-color: #cbd8f4;
      box-shadow: 0 18px 44px rgba(30, 41, 59, 0.12);
    }

    .role-icon {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: var(--primary-soft);
      font-size: 26px;
      margin-bottom: 18px;
    }

    .role-card h2 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .role-card p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .role-card .count {
      display: inline-block;
      margin-top: 18px;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--surface-soft);
      color: var(--primary);
      font-size: 13px;
      font-weight: 700;
    }

    .document-page {
      display: none;
    }

    .doc-topbar {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 20px;
    }

    .back-btn {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--primary);
      cursor: pointer;
      font-weight: 700;
      padding: 8px 0;
    }

    .doc-summary {
      background: linear-gradient(135deg, #ffffff 0%, #f6f8ff 100%);
      border: 1px solid #dfe7f6;
      border-radius: var(--radius);
      padding: 26px;
      box-shadow: var(--shadow);
      margin-bottom: 22px;
    }

    .doc-summary h2 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .doc-summary p {
      margin: 0;
      color: var(--muted);
    }

    .doc-list {
      display: grid;
      gap: 16px;
    }

    details.document {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(30, 41, 59, 0.05);
    }

    details.document[open] {
      border-color: #ccd8ee;
    }

    details.document summary {
      list-style: none;
      cursor: pointer;
      padding: 20px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      font-weight: 800;
      font-size: 18px;
    }

    details.document summary::-webkit-details-marker {
      display: none;
    }

    .doc-badge {
      flex: none;
      font-size: 12px;
      color: var(--primary);
      background: var(--primary-soft);
      border-radius: 999px;
      padding: 5px 9px;
    }

    .doc-content {
      border-top: 1px solid var(--line);
      padding: 28px 28px 34px;
    }

    .doc-content h3 {
      margin: 30px 0 8px;
      font-size: 19px;
      color: #243b6b;
    }

    .doc-content h3:first-child {
      margin-top: 0;
    }

    .doc-content p {
      margin: 8px 0 14px;
    }

    .doc-content ol,
    .doc-content ul {
      margin: 8px 0 16px;
      padding-left: 1.5rem;
    }

    .doc-content li {
      margin-bottom: 6px;
    }

    .doc-content strong {
      color: #172554;
    }

    .soft-box {
      margin: 16px 0;
      padding: 14px 16px;
      border-radius: 12px;
      background: var(--surface-soft);
      border: 1px solid #e8edf5;
    }

    .footer {
      margin-top: 32px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 820px) {
      .roles {
        grid-template-columns: 1fr;
      }

      .page-shell {
        width: min(100% - 24px, 1120px);
        padding-top: 24px;
      }

      .doc-content {
        padding: 22px 18px 28px;
      }

      details.document summary {
        padding: 18px;
        align-items: flex-start;
      }
    }
  </style>
</head>

    function openRole(roleKey) {
      const role = roles[roleKey];

      document.getElementById("rolePage").style.display = "none";
      document.getElementById("documentPage").style.display = "block";

      document.getElementById("roleTitle").textContent = role.title;
      document.getElementById("roleDescription").textContent = role.description;

      const list = document.getElementById("documentList");
      list.innerHTML = "";

      role.docs.forEach((docKey, index) => {
        const doc = docs[docKey];

        const details = document.createElement("details");
        details.className = "document";

        if (index === 0) {
          details.open = true;
        }

        details.innerHTML = `
          <summary>
            <span>${doc.title}</span>
            <span class="doc-badge">${doc.tag}</span>
          </summary>
          <div class="doc-content">
            ${doc.html}
          </div>
        `;

        list.appendChild(details);
      });

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    function goBack() {
      document.getElementById("documentPage").style.display = "none";
      document.getElementById("rolePage").style.display = "block";
